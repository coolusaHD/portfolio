name: validate-lint-prettier

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 🔎 Lint, format & build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run prettier-check

      - name: Check types & a11y
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          for file in dist/index.html dist/en/index.html dist/404.html dist/sitemap-index.xml; do
            if [ ! -s "$file" ]; then
              echo "::error::Expected build artefact '$file' is missing or empty."
              exit 1
            fi
          done
          echo "Build output looks good ($(find dist -type f | wc -l) files)."
